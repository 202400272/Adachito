    ],

    trivia: "En la novela, el banco corresponde a la zona de Kamimakuwa en Gifu (p.25). Este pequeño banco es el origen de todo: si Shimamura no hubiera visto a Adachi sentada aquí, nada habría comenzado."
  }
];

const categoryColors = {
  morela: { color: '#c4789a', icon: '🏬' },
  gifu:   { color: '#5a8fb5', icon: '⛩' },
  nagoya: { color: '#d4a853', icon: '🗼' },
  tokyo:  { color: '#8fba9a', icon: '🌸' },
  other:  { color: '#7a6882', icon: '📍' }
};

const typeColors = {
  main: '#c4789a',
  shop: '#d4a853',
  nature: '#8fba9a',
  transport: '#5a8fb5',
  other: '#7a6882'
};

const map = L.map('map', {
  center: [35.44, 136.78],
  zoom: 10,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '©OpenStreetMap ©CartoDB',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

function createIcon(location) {
  const cat = categoryColors[location.category] || categoryColors.other;
  const color = typeColors[location.type] || '#7a6882';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="42" viewBox="0 0 36 42">
    <defs>
      <filter id="shadow-${location.id}" x="-30%" y="-20%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
      </filter>
    </defs>
    <path d="M18 2C10.3 2 4 8.3 4 16c0 11 14 28 14 28S32 27 32 16C32 8.3 25.7 2 18 2z" 
          fill="${color}" filter="url(#shadow-${location.id})" opacity="0.9"/>
    <circle cx="18" cy="16" r="9" fill="white" opacity="0.95"/>
    <text x="18" y="20" text-anchor="middle" font-family="Noto Serif JP, serif" 
          font-size="9" font-weight="600" fill="${color}">${location.num}</text>
  </svg>`;
  return L.divIcon({
    html: svg,
    iconSize: [36, 42],
    iconAnchor: [18, 42],
    popupAnchor: [0, -44],
    className: ''
  });
}

const markers = [];

locations.forEach(loc => {
  const marker = L.marker([loc.lat, loc.lng], { icon: createIcon(loc) });
  const cat = categoryColors[loc.category] || categoryColors.other;
  marker.bindPopup(`
    <div class="popup-name">${loc.num} ${loc.name}</div>
    <div class="popup-sub">${loc.nameEs || ''}</div>
    <div class="popup-click">Clic para más detalles →</div>
  `, { maxWidth: 220 });
  marker.on('click', () => {
    openPanel(loc);
    document.getElementById('welcomePanel').classList.add('hidden');
  });
  marker.locationData = loc;
  marker.addTo(map);
  markers.push(marker);
});

function openPanel(loc) {
  document.getElementById('pRegion').textContent = loc.region;
  document.getElementById('pTitle').textContent = loc.num + ' ' + loc.name;
  document.getElementById('pNum').textContent = loc.nameEs || '';

  const typeBadgeMap = {
    main: ['badge-main', 'Lugar principal'],
    shop: ['badge-shop', 'Tienda / Restaurante'],
    nature: ['badge-nature', 'Naturaleza / Parque'],
    transport: ['badge-transport', 'Transporte'],
    other: ['badge-other', 'Otro']
  };
  const [badgeClass, badgeLabel] = typeBadgeMap[loc.type] || ['badge-other', 'Lugar'];

  let scenesHTML = loc.scenes.map(s => `
    <div class="scene-card">
      <div class="scene-ep">${s.ep}</div>
      ${s.text}
    </div>
  `).join('');

  let infoHTML = '';
  if (loc.info) {
    const i = loc.info;
    if (i.access) infoHTML += `<div class="info-row"><span class="info-icon">🚌</span><span>${i.access}</span></div>`;
    if (i.address) infoHTML += `<div class="info-row"><span class="info-icon">📍</span><span>${i.address}</span></div>`;
    if (i.time) infoHTML += `<div class="info-row"><span class="info-icon">🕐</span><span>${i.time}</span></div>`;
  }

  const imgId = `img-${loc.id}`;
  const imgSrc = window._imgCache && window._imgCache[loc.id] ? window._imgCache[loc.id] : null;

  document.getElementById('pBody').innerHTML = `
    <div class="panel-section">
      <span class="type-badge ${badgeClass}">${badgeLabel}</span>
      <div class="section-label">Fotografía del lugar</div>
      <div class="img-placeholder" id="${imgId}" title="Haz clic para subir una imagen">
        <input type="file" accept="image/*" onchange="loadImg(event, ${loc.id}, '${imgId}')">
        ${imgSrc
          ? `<img src="${imgSrc}" alt="${loc.name}">`
          : `<div class="img-placeholder-icon">🌸</div>
             <div class="img-placeholder-label">Espacio para fotografía
               <span>Haz clic para agregar imagen</span>
             </div>`
        }
      </div>
    </div>
    <div class="panel-section">
      <div class="section-label">Escenas de la historia</div>
      ${scenesHTML}
    </div>
    ${infoHTML ? `<div class="panel-section"><div class="section-label">Información de acceso</div>${infoHTML}</div>` : ''}
    ${loc.mapsUrl ? `
    <div class="panel-section">
      <div class="section-label">Google Maps</div>
      <a class="maps-link" href="${loc.mapsUrl}" target="_blank" rel="noopener noreferrer">
        <svg class="maps-link-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#EA4335"/>
          <path d="M12 2C8.13 2 5 5.13 5 9c0 1.82.59 3.5 1.59 4.87L12 2z" fill="#C5221F"/>
          <path d="M12 2v7l4.41 6.87C17.41 14.5 19 11.82 19 9c0-3.87-3.13-7-7-7z" fill="#FBBC04"/>
          <path d="M12 9l-4.41 6.87C8.78 17.2 10.31 18 12 18s3.22-.8 4.41-2.13L12 9z" fill="#34A853"/>
          <circle cx="12" cy="9" r="2.5" fill="white"/>
        </svg>
        <span class="maps-link-text">Ver en Google Maps
          <small>${loc.info && loc.info.address ? loc.info.address : loc.name}</small>
        </span>
        <span class="maps-link-arrow">↗</span>
      </a>
    </div>` : ''}
    ${loc.trivia ? `
    <div class="panel-section">
      <div class="section-label">Curiosidades</div>
      <div class="trivia-box">${loc.trivia}</div>
    </div>` : ''}
    <div class="sakura-divider">✿ ✿ ✿</div>
  `;

  document.getElementById('sidePanel').classList.add('open');
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
}

let activeFilter = 'all';
function filterMarkers(category, btn) {
  activeFilter = category;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  markers.forEach(m => {
    const loc = m.locationData;
    const show = category === 'all' || loc.category === category;
    if (show) {
      if (!map.hasLayer(m)) m.addTo(map);
    } else {
      if (map.hasLayer(m)) map.removeLayer(m);
    }
  });
  if (category !== 'all') {
    const visible = markers.filter(m => m.locationData.category === category && map.hasLayer(m));
    if (visible.length > 0) {
      const group = L.featureGroup(visible);
      map.flyToBounds(group.getBounds().pad(0.2), { duration: 0.8 });
    }
  } else {
    map.flyTo([35.44, 136.78], 10, { duration: 0.8 });
  }
}

window._imgCache = {};

function loadImg(event, locId, containerId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    window._imgCache[locId] = e.target.result;
    const container = document.getElementById(containerId);
    if (container) {
      const existing = container.querySelector('img');
      const icon = container.querySelector('.img-placeholder-icon');
      const label = container.querySelector('.img-placeholder-label');
      if (icon) icon.remove();
      if (label) label.remove();
      if (existing) {
        existing.src = e.target.result;
      } else {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.alt = 'Lugar';
        container.appendChild(img);
      }
    }
  };
  reader.readAsDataURL(file);
}

map.on('click', () => {
  const panel = document.getElementById('sidePanel');
  if (panel.classList.contains('open')) closePanel();
});
</script>
</body>
</html>
