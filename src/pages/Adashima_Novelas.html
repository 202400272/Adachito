<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Adashima · Novelas Ligeras" />

      property="og:description"
      content="Discover the light novel library for Adachi and Shimamura with summaries, volumes, and story details."
    />
    <meta
      property="og:url"
      content="https://adashimaverse.com/Adashima_Novelas"
    />
    <meta
      property="og:image"
      content="https://adashimaverse.com/Imagenes/Social_Card.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://adashimaverse.com/Imagenes/Social_Card.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AdashimaVerse - Adashima · Novelas Ligeras"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adashima · Novelas Ligeras" />
    <meta
      name="twitter:description"
      content="Discover the light novel library for Adachi and Shimamura with summaries, volumes, and story details."
    />
    <meta
      name="twitter:image"
      content="https://adashimaverse.com/Imagenes/Social_Card.png"
    />
    <meta
      name="twitter:image:alt"
      content="AdashimaVerse - Adashima · Novelas Ligeras"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/src/components/styles/menu.css" />
    <link rel="stylesheet" href="/src/css/lang-switch.css" />
    <link rel="stylesheet" href="/src/components/styles/pdf-reader.css" />

    <link rel="stylesheet" href="/src/css/novels/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/Imagenes/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/Imagenes/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/Imagenes/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/Imagenes/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/Imagenes/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/assets/Imagenes/icon-512x512.png"
    />
  </head>
  <body>
    <div class="particles" id="particles"></div>
    <div id="menu-container" style="display: contents"></div>

    <div class="main-content">
      <div class="header-container">
        <div class="header-top-controls">
          
        </div>
        <h1 class="update-title" id="page-title">Novelas Ligeras</h1>
      </div>

      <div class="library-controls" id="libraryControls">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar por título, descripción, volumen..."
            aria-label="Buscar novelas"
          />
        </div>
        <div
          class="view-toggle-group"
          role="group"
          aria-label="Vista de novelas"
        >
          <button
            class="view-toggle-btn active"
            data-view="list"
            id="viewListBtn"
          >
            <i class="fas fa-list-ul"></i> Lista
          </button>
          <button class="view-toggle-btn" data-view="grid" id="viewGridBtn">
            <i class="fas fa-th"></i> Cuadrícula
          </button>
        </div>
      </div>

      <div class="update-box" id="novels-container">
        <!-- dynamic content -->
      </div>

      <a
        href="/Juego"
        class="floating-adashima"
        title="Ir al mini-juego"
        id="floating-link"
      >
        <img
          src="/assets/Imagenes/Adashima_flotante2-Photoroom.png"
          alt="Adashima Chibi Floating"
          onerror="this.style.display = 'none'"
        />
      </a>

      <div class="footer" id="footer-content">
        Fan site no oficial de Adachi to Shimamura.<br />
        Creado por fans, sin fines de lucro.<br />
        Adachi to Shimamura y todos sus derechos pertenecen a Hitoma Iruma.
      </div>
    </div>

    <!-- PDF Modal (shared, rendered once) -->
    <div
      class="pdf-modal"
      id="pdfModal"
      role="dialog"
      aria-modal="true"
      aria-label="PDF Viewer"
    >
      <div class="pdf-modal-backdrop" id="pdfModalBackdrop"></div>
      <div class="pdf-modal-content">
        <div class="pdf-modal-header">
          <h2 class="pdf-modal-title" id="pdfModalTitle">
            Leyendo: <span id="pdfVolumeTitle">Volumen</span>
          </h2>
          <button
            class="pdf-modal-close"
            id="pdfModalClose"
            aria-label="Cerrar lector"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="pdf-modal-body">
          <!-- Enhanced PDF Viewer -->
          <div class="custom-pdf-viewer" id="pdfViewerModal">
            <!-- Loading Overlay -->
            <div class="pdf-loading-overlay" id="pdfLoadingModal">
              <div class="pdf-spinner"></div>
              <span class="pdf-loading-text" id="pdfLoadingTextModal"
                >Cargando documento...</span
              >
            </div>

            <!-- Toolbar -->
            <div class="pdf-toolbar">
              <div class="pdf-controls-group pdf-toolbar-left">
                <!-- Thumbnail Toggle -->
                <button
                  class="pdf-btn pdf-btn-thumbnails"
                  id="pdfThumbnailToggle"
                  title="Miniaturas"
                >
                  <i class="fas fa-th"></i>
                </button>
                <span class="pdf-toolbar-divider"></span>
                <button
                  class="pdf-btn"
                  id="pdfPrevModal"
                  title="Página anterior (←)"
                >
                  <i class="fas fa-chevron-left"></i>
                </button>
                <button
                  class="pdf-btn"
                  id="pdfNextModal"
                  title="Página siguiente (→)"
                >
                  <i class="fas fa-chevron-right"></i>
                </button>
                <span class="pdf-page-info" id="pdfPageInfo"
                  ><span id="pdfPageLabel">Pág.</span>
                  <span id="pageNumModal">-</span> /
                  <span id="pageCountModal">-</span></span
                >
                <input
                  type="number"
                  id="pageInputModal"
                  class="pdf-page-input"
                  min="1"
                  placeholder="Ir a"
                />
              </div>

              <div class="pdf-controls-group pdf-toolbar-right">
                <button class="pdf-btn" id="pdfZoomOutModal" title="Alejar (-)">
                  <i class="fas fa-search-minus"></i>
                </button>
                <span class="pdf-zoom-display" id="zoomDisplayModal">100%</span>
                <button class="pdf-btn" id="pdfZoomInModal" title="Acercar (+)">
                  <i class="fas fa-search-plus"></i>
                </button>
                <button
                  class="pdf-btn pdf-btn-reset"
                  id="pdfZoomResetModal"
                  title="Restablecer zoom (0)"
                >
                  <i class="fas fa-sync-alt"></i>
                </button>
                <span class="pdf-toolbar-divider"></span>
                <button
                  class="pdf-btn"
                  id="pdfFullscreenModal"
                  title="Pantalla completa (F)"
                >
                  <i class="fas fa-expand" id="fsIconModal"></i>
                </button>
                <button
                  class="pdf-btn"
                  id="pdfDownloadModal"
                  title="Descargar PDF"
                >
                  <i class="fas fa-download"></i>
                </button>
                <button
                  class="pdf-btn"
                  id="epubDownloadModal"
                  title="Descargar EPUB"
                  style="display: none"
                >
                  <i class="fas fa-book"></i>
                </button>
              </div>
            </div>

            <div class="pdf-progress-wrap">
              <div
                class="pdf-progress-fill"
                id="pdfProgressModal"
                style="width: 0%"
              ></div>
            </div>

            <!-- Main Body with Thumbnails Sidebar -->
            <div class="pdf-body-wrapper">
              <!-- Thumbnails Sidebar -->
              <div class="pdf-thumbnails-sidebar" id="pdfThumbnailsSidebar">
                <div class="pdf-thumbnails-header">
                  <span id="pdfThumbnailsTitle">Miniaturas</span>
                  <button
                    class="pdf-btn pdf-thumbnails-close"
                    id="pdfThumbnailsClose"
                  >
                    <i class="fas fa-times"></i>
                  </button>
                </div>
                <div class="pdf-thumbnails-list" id="pdfThumbnailsList">
                  <!-- Thumbnails rendered here -->
                </div>
              </div>

              <!-- Canvas Container -->
              <div class="pdf-body">
                <div class="pdf-canvas-container" id="canvasContainerModal">
                  <div class="pdf-canvas-wrapper" id="canvasWrapperModal">
                    <canvas id="pdfRenderModal"></canvas>
                  </div>
                  <div
                    class="pdf-page-indicator-mobile"
                    id="mobileIndicatorModal"
                    style="display: none"
                  >
                    <span id="mobilePageNumModal">-</span>
                    <span>/</span>
                    <span id="mobilePageCountModal">-</span>
                  </div>
                  <div class="pdf-error-state" id="pdfErrorModal">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p id="pdfErrorMsgModal">Documento no disponible.</p>
                    <button
                      class="btn"
                      id="pdfRetryModal"
                      style="margin-top: 8px"
                    >
                      <i class="fas fa-redo"></i>
                      <span id="pdfRetryText">Reintentar</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-message" class="toast-message"></div>

    <!-- Import JS -->
    <script src="/src/js/language-switch.js"></script>
    <script src="/src/js/novelas.js"></script>
  </body>
</html>
