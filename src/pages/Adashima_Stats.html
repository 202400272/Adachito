      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css?v=20260812"

    <link rel="stylesheet" href="/src/components/styles/scrollbar.css?v=20260812" />

    <style>
      body {
        display: flex;
        align-items: flex-start;
      }
      main.stats-main {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
      }
      body {
        padding-top: 0;
      }
      .sidebar {
        top: 0;
      }
      @media (max-width: 900px) {
        body {
          display: block;
        }
      }
    </style>

    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/Imagenes/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/Imagenes/apple-touch-icon.webp"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/Imagenes/favicon-32x32.webp"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/Imagenes/favicon-16x16.webp"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/Imagenes/icon-192x192.webp"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/assets/Imagenes/icon-512x512.webp"
    />
  </head>
  <body>
    <div id="sidebar-container" style="display: contents"></div>

    <div class="particles" id="particles"></div>

    <div class="floating-decor decor-1">
      <iconify-icon icon="fa6-regular:star"></iconify-icon>
    </div>
    <div class="floating-decor decor-2">
      <iconify-icon icon="fa6-regular:moon"></iconify-icon>
    </div>
    <div class="floating-decor decor-3">
      <iconify-icon icon="fa6-regular:snowflake"></iconify-icon>
    </div>

    <main class="stats-main main-content">
      <div class="stats-header">
        <h1 class="stats-title">
          <iconify-icon icon="fa6-regular:heart"></iconify-icon> Adachi &amp;
          Shimamura <iconify-icon icon="fa6-regular:heart"></iconify-icon>
        </h1>
        <p class="stats-subtitle">
          An interactive archive exploring the publication history, translation
          timeline, and structure of the entire series.
        </p>
      </div>

      <nav class="stats-nav" id="statsNav">
        <button class="stats-nav-item active" data-section="overview">
          Overview
        </button>
        <button class="stats-nav-item" data-section="dashboard">
          Dashboard
        </button>
        <button class="stats-nav-item" data-section="timeline">Timeline</button>
        <button class="stats-nav-item" data-section="translation">
          Translation
        </button>
        <button class="stats-nav-item" data-section="charts">Charts</button>
        <button class="stats-nav-item" data-section="compare">Compare</button>
        <button class="stats-nav-item" data-section="volumes">Volumes</button>
        <button class="stats-nav-item" data-section="achievements">
          Achievements
        </button>
      </nav>

      <div id="statsLoading" class="stats-loading">
        <div class="stats-spinner"></div>
        <p>Loading statistics...</p>
      </div>

      <div id="statsContent" class="stats-content" style="display: none"></div>

      <div class="stats-footer">
        <p>Unofficial Adachi to Shimamura fan site.</p>
        <p class="stats-footer-sub">Created by fans, non-profit.</p>
        <p class="stats-footer-sub">
          Adachi to Shimamura and all rights belong to Hitoma Iruma.
        </p>
      </div>
    </main>

    <div class="floating-adashima">
      <img
        src="/assets/Imagenes/astronauta.png"
        alt="Adashima Astronauta"
        loading="lazy"
        decoding="async"
        onerror="this.style.display = 'none'"
      />
    </div>

    <div id="toastMessage" class="toast-message"></div>

    <!-- Import JS -->
    <script src="/src/js/language-switch.js?v=20260812"></script>
    <script src="/src/js/stats.js?v=20260812"></script>
  </body>
</html>
