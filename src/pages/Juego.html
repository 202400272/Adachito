  <body>
    <audio id="bgMusic" loop preload="auto">
      <source src="/assets/Sound/ada8bit.mp3" type="audio/mp3" />
    </audio>

    <div class="particles" id="particles"></div>
    <div class="floating-decor decor-1"></div>
    <div class="floating-decor decor-2"></div>
    <div class="floating-decor decor-3"></div>

    <div id="menu-container"></div>

    <div class="main-content">
      <div class="header-container">
        <h1 class="update-title" id="pageTitle" data-es="Yashiro Game" data-en="Yashiro Game">
          Yashiro Game
        </h1>
      </div>

      <div class="update-box">
        <div id="gameContainer">
          <canvas id="gameCanvas" width="800" height="300"></canvas>

          <button id="musicToggle" class="music-toggle" aria-label="Alternar Música">
            <i class="fas fa-volume-mute"></i>
          </button>
        </div>

        <div class="mechanics-panel" id="mechanicsPanel">
          <span
            class="mechanic-tip"
            data-es="Lluvia cada 50s · dura 15s"
            data-en="Rain every 50s · lasts 15s"
            >Rain every 50s · lasts 15s</span
          >
          <span
            class="mechanic-tip"
            data-es="Dona a partir de los 100s (cada 30s)"
            data-en="Donut from 100s (every 30s)"
            >Donut from 100s (every 30s)</span
          >
          <span
            class="mechanic-tip"
            data-es="Velocidad sube naturalmente"
            data-en="Speed rises naturally"
            >Speed rises naturally</span
          >
          <span
            class="mechanic-tip"
            data-es="ESPACIO saltar · ↓ boomerang"
            data-en="SPACE jump · ↓ boomerang"
            >SPACE jump · ↓ boomerang</span
          >
        </div>

        <div id="mobileControls">
          <div class="mobile-controls-row">
            <button class="btn-jump" id="btnJump" aria-label="Jump">
              <span class="btn-label" data-es="SALTAR" data-en="JUMP">JUMP</span>
            </button>
            <button class="btn-shoot" id="btnShoot" aria-label="Shoot boomerang">
              <span class="btn-label" data-es="BOOMERANG" data-en="BOOMERANG">BOOMERANG</span>
            </button>
          </div>
          <p
            class="mobile-hint"
            data-es="Toca SALTAR para reiniciar cuando pierdas"
            data-en="Tap JUMP to restart when you lose"
          >
            Tap JUMP to restart when you lose
          </p>
        </div>

        <div class="instructions" id="desktopInstructions">
          <h2
            data-es="Presiona ESPACIO o haz clic para saltar"
            data-en="Press SPACE or click to jump"
          >
            Press SPACE or click to jump
          </h2>
        </div>
      </div>

      <div id="footer-container"></div>
      <script type="module" src="/src/components/js/footer.js"></script>
    </div>

    <!-- Import JS -->
    <script src="/src/js/language-switch.js?v=20260812"></script>
    <script src="/src/js/juego.js?v=20260812"></script>
    <script type="module" src="/src/components/js/feedback.js"></script>
  </body>
