<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Menú — Adashima</title>
    <style>
        body { font-family: monospace; background: #0a051e; color: #e8d5f0; padding: 20px; margin: 0; }
        h2 { color: #f06292; margin-bottom: 10px; }
        .log { background: #1a0a2e; border: 1px solid #f06292; border-radius: 8px; padding: 14px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; font-size: 0.85rem; line-height: 1.7; }
        .ok   { color: #69ff8a; }
        .warn { color: #ffd166; }
        .err  { color: #ff6b6b; }
        .info { color: #90caf9; }
        button { background: #f06292; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin: 6px 4px; font-size: 0.9rem; font-family: monospace; }
        button:active { opacity: 0.7; }
        .section { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: #ffd6f0; font-size: 0.85rem; }
        input[type=text] { background: #1a0a2e; border: 1px solid #f06292; color: #e8d5f0; padding: 6px 10px; border-radius: 8px; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 0.85rem; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-left: 6px; }
        .badge-ok { background: #1a3a2e; color: #69ff8a; border: 1px solid #69ff8a; }
        .badge-err { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
    </style>
</head>
<body>

<h2>🔍 Diagnóstico — Menú Adashima Estrella</h2>
<p style="color:rgba(255,255,255,0.6);font-size:0.8rem;margin-bottom:16px;">
    Abre este archivo en el mismo celular donde falla. Los resultados te dicen exactamente qué está fallando.
</p>

<div class="section">
    <label>Ruta del archivo Adashima_Estrella.html (relativa a esta página):</label>
    <input type="text" id="file-path" value="Adashima_Estrella.html" placeholder="Adashima_Estrella.html">
</div>

<button onclick="runAll()">▶ Ejecutar todos los diagnósticos</button>
<button onclick="clearLog()">🗑 Limpiar</button>

<div id="log" class="log"><span class="info">Presiona "Ejecutar" para comenzar...</span></div>

<div class="section">
    <h2 style="font-size:1rem;margin-bottom:10px;">🧪 Pruebas manuales rápidas</h2>
    <button onclick="testToggleDirect()">1. Probar toggle directo (sin archivo)</button>
    <button onclick="testIframeLoad()">2. Cargar Estrella en iframe y probar</button>
    <button onclick="checkCSS()">3. Verificar CSS crítico</button>
    <button onclick="checkConflicts()">4. Buscar conflictos JS</button>
</div>

<div id="iframe-container" style="display:none;margin-top:14px;">
    <p class="warn" style="margin-bottom:8px;">⬇ Iframe del archivo (interactúa con él para probar el menú):</p>
    <iframe id="test-iframe" style="width:100%;height:400px;border:2px solid #f06292;border-radius:8px;" sandbox="allow-scripts allow-same-origin"></iframe>
    <button onclick="probeIframe()" style="margin-top:8px;">Analizar iframe</button>
</div>

<script>
const logEl = document.getElementById('log');

function log(msg, type = 'info') {
    const line = document.createElement('div');
    line.className = type;
    line.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
    logEl.innerHTML = '';
}

// ── 1. TOGGLE DIRECTO ─────────────────────────────────────────────
function testToggleDirect() {
    log('=== PRUEBA 1: Toggle directo ===', 'info');
    
    // Simular sidebar y botón
    const mockSidebar = document.createElement('div');
    mockSidebar.id = '__test_sidebar__';
    mockSidebar.style.cssText = 'position:fixed;top:0;left:0;width:200px;height:100px;background:#f06292;z-index:99999;transform:translateX(-110%);transition:transform 0.3s;';
    document.body.appendChild(mockSidebar);

    const mockBtn = document.createElement('button');
    mockBtn.id = '__test_btn__';
    mockBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;background:#64b5f6;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-size:1rem;cursor:pointer;';
    mockBtn.textContent = 'TEST TOGGLE';
    document.body.appendChild(mockBtn);

    let isOpen = false;
    mockBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        isOpen = !isOpen;
        mockSidebar.style.transform = isOpen ? 'translateX(0)' : 'translateX(-110%)';
        mockBtn.textContent = isOpen ? '✓ ABIERTO' : 'TEST TOGGLE';
        log('Click en botón → sidebar ' + (isOpen ? 'ABIERTO ✓' : 'CERRADO'), isOpen ? 'ok' : 'warn');
    });

    // Click programático
    setTimeout(() => {
        mockBtn.click();
        setTimeout(() => {
            const transform = window.getComputedStyle(mockSidebar).transform;
            const isVisible = transform === 'none' || transform === 'matrix(1, 0, 0, 1, 0, 0)';
            log('Transform computado: ' + transform, 'info');
            log('¿Sidebar visible? ' + (isVisible ? 'SÍ ✓' : 'NO ✗'), isVisible ? 'ok' : 'err');
            
            // Limpiar después de 4s
            setTimeout(() => {
                mockSidebar.remove();
                mockBtn.remove();
                log('Elementos de prueba eliminados.', 'info');
            }, 4000);
        }, 400);
    }, 500);
}

// ── 2. IFRAME ─────────────────────────────────────────────────────
function testIframeLoad() {
    const path = document.getElementById('file-path').value.trim();
    log('=== PRUEBA 2: Cargando ' + path + ' en iframe ===', 'info');
    
    const container = document.getElementById('iframe-container');
    const iframe    = document.getElementById('test-iframe');
    container.style.display = 'block';
    iframe.src = path;
    
    iframe.onload = function() {
        log('✓ iframe cargado correctamente', 'ok');
        setTimeout(probeIframe, 800);
    };
    iframe.onerror = function() {
        log('✗ Error al cargar el iframe — verifica la ruta', 'err');
    };
}

function probeIframe() {
    log('--- Analizando iframe ---', 'info');
    try {
        const doc = document.getElementById('test-iframe').contentDocument;
        if (!doc) { log('✗ No se puede acceder al iframe (CORS o no cargado)', 'err'); return; }
        const win = document.getElementById('test-iframe').contentWindow;

        // Verificar elementos críticos
        const btn     = doc.getElementById('menu-toggle-btn');
        const sidebar = doc.getElementById('sideMenu');

        log('Botón #menu-toggle-btn: ' + (btn ? '✓ Existe' : '✗ NO ENCONTRADO'), btn ? 'ok' : 'err');
        log('Sidebar #sideMenu: '       + (sidebar ? '✓ Existe' : '✗ NO ENCONTRADO'), sidebar ? 'ok' : 'err');

        if (btn) {
            const cs = win.getComputedStyle(btn);
            log('Botón display: ' + cs.display, cs.display !== 'none' ? 'ok' : 'warn');
            log('Botón visibility: ' + cs.visibility, 'info');
            log('Botón z-index: ' + cs.zIndex, 'info');
            log('Botón pointer-events: ' + cs.pointerEvents, cs.pointerEvents !== 'none' ? 'ok' : 'err');
            const rect = btn.getBoundingClientRect();
            log('Botón posición: top=' + Math.round(rect.top) + ' left=' + Math.round(rect.left) + ' w=' + Math.round(rect.width) + ' h=' + Math.round(rect.height), 'info');
            log('Botón en viewport: ' + (rect.width > 0 && rect.height > 0 ? '✓ SÍ' : '✗ NO (invisible)'), rect.width > 0 ? 'ok' : 'err');
        }

        if (sidebar) {
            const cs = win.getComputedStyle(sidebar);
            log('Sidebar position: ' + cs.position, 'info');
            log('Sidebar transform: ' + cs.transform, 'info');
            log('Sidebar z-index: ' + cs.zIndex, 'info');
        }

        // Verificar función menuToggle
        log('window.menuToggle: ' + (typeof win.menuToggle), typeof win.menuToggle === 'function' ? 'ok' : 'err');
        log('window.toggleMenu: ' + (typeof win.toggleMenu), typeof win.toggleMenu === 'function' ? 'ok' : 'warn');

        // Contar listeners de 'click' globales (aproximación)
        log('--- Probando click programático en el botón ---', 'info');
        if (btn && typeof win.menuToggle === 'function') {
            win.menuToggle();
            setTimeout(() => {
                const cs2 = win.getComputedStyle(sidebar);
                const transform = cs2.transform;
                log('Transform después de menuToggle(): ' + transform, 'info');
                const opened = sidebar.classList.contains('active');
                log('sidebar.classList tiene "active": ' + (opened ? '✓ SÍ' : '✗ NO'), opened ? 'ok' : 'err');
                if (!opened) {
                    log('⚠ menuToggle() se ejecuta pero sidebar NO abre. Posible causa: CSS overriding transform o z-index bloqueado', 'warn');
                }
            }, 500);
        }

    } catch(e) {
        log('✗ Error al analizar iframe: ' + e.message, 'err');
    }
}

// ── 3. CSS CRÍTICO ────────────────────────────────────────────────
function checkCSS() {
    log('=== PRUEBA 3: CSS crítico del navegador actual ===', 'info');

    // Crear elementos de prueba rápidos
    const testDiv = document.createElement('div');
    testDiv.style.cssText = 'display:none;justify-content:center;align-items:center;';
    document.body.appendChild(testDiv);

    // Media query check
    const mq900 = window.matchMedia('(max-width: 900px)');
    const mq600 = window.matchMedia('(max-width: 600px)');
    log('¿Pantalla ≤ 900px (móvil)? ' + (mq900.matches ? 'SÍ ✓' : 'NO — el botón no debería mostrarse'), mq900.matches ? 'ok' : 'warn');
    log('¿Pantalla ≤ 600px (pequeño)? ' + mq600.matches, 'info');
    log('window.innerWidth: ' + window.innerWidth + 'px', 'info');
    log('window.devicePixelRatio: ' + window.devicePixelRatio, 'info');

    // CSS variables
    const bodyStyle = window.getComputedStyle(document.body);
    log('¿body tiene display:flex? ' + bodyStyle.display, bodyStyle.display === 'flex' ? 'ok' : 'warn');

    // touch support
    log('ontouchstart soportado: ' + ('ontouchstart' in window ? '✓ SÍ (táctil)' : 'NO (desktop/mouse)'), 'info');
    log('navigator.maxTouchPoints: ' + navigator.maxTouchPoints, 'info');

    // backdrop-filter soporte
    const supportsBackdrop = CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)');
    log('backdrop-filter soportado: ' + (supportsBackdrop ? '✓ SÍ' : '✗ NO (no afecta al toggle)'), supportsBackdrop ? 'ok' : 'warn');

    testDiv.remove();
}

// ── 4. CONFLICTOS JS ──────────────────────────────────────────────
function checkConflicts() {
    log('=== PRUEBA 4: Conflictos JS en esta página ===', 'info');
    log('window.menuToggle (esta página): ' + typeof window.menuToggle, typeof window.menuToggle === 'undefined' ? 'ok' : 'warn');
    log('window.toggleMenu (esta página): ' + typeof window.toggleMenu, typeof window.toggleMenu === 'undefined' ? 'ok' : 'warn');

    // Detectar múltiples IDs (si el iframe está cargado)
    try {
        const iframeDoc = document.getElementById('test-iframe')?.contentDocument;
        if (iframeDoc) {
            const btns     = iframeDoc.querySelectorAll('#menu-toggle-btn');
            const sidebars = iframeDoc.querySelectorAll('#sideMenu');
            log('Elementos #menu-toggle-btn encontrados: ' + btns.length, btns.length === 1 ? 'ok' : 'err');
            log('Elementos #sideMenu encontrados: ' + sidebars.length, sidebars.length === 1 ? 'ok' : 'err');
            if (btns.length > 1) log('⚠ HAY DUPLICADOS DE #menu-toggle-btn — conflicto garantizado', 'err');
            if (sidebars.length > 1) log('⚠ HAY DUPLICADOS DE #sideMenu — conflicto garantizado', 'err');

            // Verificar si hay fetch de menu.html
            const scripts = iframeDoc.querySelectorAll('script');
            let fetchesMenu = false;
            scripts.forEach(s => {
                if (s.textContent.includes('menu.html')) fetchesMenu = true;
            });
            log('¿El archivo hace fetch de menu.html? ' + (fetchesMenu ? '⚠ SÍ — posible duplicado de sidebar' : 'NO ✓'), fetchesMenu ? 'err' : 'ok');
        } else {
            log('Carga primero el iframe (Prueba 2) para analizar conflictos', 'warn');
        }
    } catch(e) {
        log('No se puede analizar el iframe: ' + e.message, 'warn');
    }
}

// ── ALL ───────────────────────────────────────────────────────────
function runAll() {
    clearLog();
    log('==== INICIO DE DIAGNÓSTICO COMPLETO ====', 'info');
    log('User Agent: ' + navigator.userAgent.substring(0, 80), 'info');
    checkCSS();
    setTimeout(() => testIframeLoad(), 500);
    setTimeout(() => checkConflicts(), 2500);
}
</script>
</body>
</html>
